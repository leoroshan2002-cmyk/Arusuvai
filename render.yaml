services:
  - type: web
    name: arusuvai
    runtime: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CLIENT_URL
        value: https://frontend-phi-red-1gmtxyppc3.vercel.app,https://arusuvaui.vercel.app
